 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <div class="container">
    <h2>Student Management System</h2>
    <form action="">
        <div>
            <label>Name:</label>
            <input type="text" id="name" placeholder="Name">
        </div>
        <div>
            <label>Age:</label>
            <input type="number" id="age" placeholder="Age">
        </div>
        <div>
            <label>Course:</label>
            <input type="text" id="course" placeholder="Course">
        </div>
        <div>
            <label>Mark:</label>
            <input type="number" id="mark" placeholder="Mark">
        </div>
 
    </form>
    <button style="margin-top: 15px;" onclick="addStudents()">Add Student</button><br><br>
    <input type="search" id="search" oninput="searchStudent()" placeholder="Search Student">
    
    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Mark</th>
            </tr>
        </thead>
        <tbody id="tbody-item">

        </tbody>
    </table>

    <button onclick="sortHigh()">Sort High:</button>
    <button onclick="sortLow()">Sort Low:</button>

    <div class="stats">
    <h3 id="highest">Highest Mark:</h3><br>
    <h3 id="lowest">Lowest Mark:</h3><br>
    <h3 id="average">Average Mark:</h3>
    <h3 id="totalstudents">Total Students:</h3>
    <h3 id="pass">Pass Count:</h3>
    <h3 id="fail">Fail Count:</h3>
    </div>
    <button class="clear-btn" onclick="clearAll()">Clear All</button>

    </div>

    <style>
        .container{
            min-height: 100%;
            background-color: lightcoral;
            padding: 20px;
            max-width: 1000px;
            margin: 20px auto;
            border-radius: 10px;
        }
        input {
            width: 250px;
            padding: 8px;
            margin: 8px 0;
            border:  1px solid gray;
            border-radius: 5px;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            opacity: 0.8;
        }
        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: lightblue;
        }
        h2{
            text-align: center;
        }
        h3{
            margin: 10px 0;
        }
        label{
            display: inline-block;
            width: 80px;
        }
        .stats{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>

    <script>

        function addStudents() {
        
            let name = document.getElementById("name").value 
            let age = document.getElementById("age").value
            let course = document.getElementById("course").value
            let mark = document.getElementById("mark").value

            if (name === '' || age === '' || course === '' || mark === ''){
                alert("Please enter Value")
                return
            }
            
            //for editing mark use if statement
            if (editIndex === null) {
                student.push({
                    name: name,
                    age: Number(age),
                    course: course,
                    mark: Number(mark)
                })
            } else {
                student[editIndex] = {
                    name: name,
                    age: Number(age),
                    course: course,
                    mark: Number(mark)
                }
                editIndex = null;
            }

            localStorage.setItem("students", JSON.stringify(student))
            
            console.log(student)
            storeTable();
            document.getElementById('name').value ="";
            document.getElementById('age').value ="";
            document.getElementById('course').value ="";
            document.getElementById('mark').value ="";
        }
        let student = JSON.parse(localStorage.getItem('students')) || [];
        let editIndex = null
        storeTable()

        function storeTable(data = student) {
            let tbody = document.getElementById('tbody-item')
            tbody.textContent = ''

            data.forEach((stud) => {
                let originalIndex = student.indexOf(stud)

                let row = document.createElement('tr')

                row.innerHTML = `
                <td>${originalIndex + 1}</td>
                <td>${stud.name}</td>
                <td>${stud.age}</td>
                <td>${stud.course}</td>
                <td>${stud.mark}</td>
                <td><button onclick='deleteStudent(${originalIndex})'>Delete</button></td>
                <td><button onclick='editStudent(${originalIndex})'>Edit</button></td>
                `
                tbody.append(row)
                console.log(row)
            })
                      
            if (student.length === 0) {

                document.getElementById('highest').textContent = "Highest Mark:";
                document.getElementById('lowest').textContent = "Lowest Mark:";
                document.getElementById('average').textContent = "Average Mark:";
                document.getElementById('totalstudents').textContent = "Total Students: 0";
                document.getElementById('pass').textContent = "Pass Count: 0";
                document.getElementById('fail').textContent = "Fail Count: 0";

                return;
            }
            //finding Highest Mark
            let highest = student[0]

            student.forEach(stud => {
                if (stud.mark > highest.mark){
                    highest = stud
                }
            })
            let highestMark = document.getElementById("highest")
            highestMark.textContent = "Highest Mark:" + highest.name + " : " + highest.mark

            //finding Lowest Mark
          
            let lowestMark = student[0]

            student.forEach(stud => {
                if (stud.mark < lowestMark.mark){
                    lowestMark = stud
                }
            })
        
            let lowest = document.getElementById("lowest")
            lowest.textContent = "Lowest Mark:" + lowestMark.name + " : " + lowestMark.mark

            //Total Students
            let totalStudents = student.length
            let students = document.getElementById("totalstudents")
            students.textContent = "Total Students:" + totalStudents

            // total marks
            let totalMarks = 0
            student.forEach(stud => {
                totalMarks = totalMarks + stud.mark
            })

            //get averagemark of students
            let averageMark = totalMarks /student.length

            let average = document.getElementById("average")
            average.textContent = "Average Mark:" + averageMark

            //Pass count of Students

            let passStudents = student.filter(stud => {
                return stud.mark >= 35
            })

            let pass = document.getElementById("pass")
            pass.textContent = "Pass Count:" + passStudents.length

            //Fail count of Students

            let failStudents = student.filter(stud => {
                return stud.mark < 35
            })

            let fail = document.getElementById("fail")
            fail.textContent = "Fail Count:" + failStudents.length

        
        } 

        function sortHigh() {
            student.sort ((a, b) => {
                return b.mark - a.mark
            })
            storeTable()
        }

        function sortLow() {
            student.sort ((a, b) => {
                return a.mark - b.mark
            })
            storeTable()
        }


        function deleteStudent(index) {
            student.splice(index, 1)
            localStorage.setItem("students", JSON.stringify(student))

            storeTable()
        }

        function editStudent(index){
           let stud = student[index];

           document.getElementById('name').value = stud.name;
           document.getElementById('age').value = stud.age;
           document.getElementById('course').value = stud.course;
           document.getElementById('mark').value = stud.mark;
            
           editIndex = index;
        }

        function searchStudent() {
            let searchValue = document.getElementById('search').value.toLowerCase();
        
            let filteredStudents = student.filter(stud =>{
                return stud.name.toLowerCase().includes(searchValue);
            })
            if(searchValue === ''){
                storeTable()
                return
            }
            
            storeTable(filteredStudents)
        }

        function clearAll() {
            let clear = confirm("Are you Sure?!")
            if (clear) {
                student= []
                localStorage.removeItem('students')
                storeTable();
                return;
            }
          
        }
    </script>
 </body>
 </html>
